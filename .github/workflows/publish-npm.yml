name: Publish TypeScript (npm)

# First publish is MANUAL (see docs/PUBLISHING.md): the account owner runs
# `npm publish --access public` once from ts/ in a terminal. Afterwards,
# pushing a `ts@*` tag publishes via npm Trusted Publishing (OIDC +
# --provenance, no stored token).
on:
  push:
    tags:
      - "ts@*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # No dependency cache in release jobs: a poisoned cache could
          # taint the published tarball.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
