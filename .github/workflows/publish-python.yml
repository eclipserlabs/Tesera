name: Publish Python (PyPI)

# First publish is MANUAL (see docs/PUBLISHING.md): the account owner runs
# `twine upload` once from a terminal. Afterwards, pushing a `py@*` tag
# publishes via PyPI Trusted Publishing (OIDC, no stored token).
on:
  push:
    tags:
      - "py@*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: tesera-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/tesera/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tesera-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
